<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1c33"/>
      <stop offset="100%" stop-color="#050a14"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b6fd1"/>
      <stop offset="100%" stop-color="#7a1530"/>
    </linearGradient>
    <linearGradient id="c" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8f1f3d"/>
      <stop offset="100%" stop-color="#5c1327"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- outer aperture ring -->
  <circle cx="256" cy="256" r="188" fill="none" stroke="url(#ring)" stroke-width="14" opacity="0.55"/>

  <!-- sprocket-hole ring, film-reel motif -->
  <g fill="#274a8a" opacity="0.5">
    <circle cx="256" cy="82" r="14"/>
    <circle cx="256" cy="430" r="14"/>
    <circle cx="82" cy="256" r="14"/>
    <circle cx="430" cy="256" r="14"/>
    <circle cx="132" cy="132" r="11"/>
    <circle cx="380" cy="132" r="11"/>
    <circle cx="132" cy="380" r="11"/>
    <circle cx="380" cy="380" r="11"/>
  </g>

  <!-- monogram C, thick film-strip style -->
  <path d="M 336 168
           A 118 118 0 1 0 336 344
           L 300 300
           A 62 62 0 1 1 300 212
           Z"
        fill="url(#c)"/>

  <!-- play triangle nested in the C, blue accent -->
  <path d="M 246 216 L 246 296 L 314 256 Z" fill="#4d84e6"/>

  <!-- highlight sheen -->
  <ellipse cx="200" cy="150" rx="120" ry="46" fill="#ffffff" opacity="0.05"/>
</svg>
