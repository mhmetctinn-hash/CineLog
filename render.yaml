services:
  - type: web
    name: cinelog-backend
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    # --include=dev: NODE_ENV=production below makes plain `npm install` skip
    # devDependencies (typescript, @types/*), which is what actually built the
    # TS compiler and made "tsc" resolve to some unrelated transitive copy.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: TMDB_API_KEY
        sync: false
      - key: TMDB_BASE_URL
        value: https://api.themoviedb.org/3
      - key: SENTRY_DSN
        sync: false

  - type: web
    name: cinelog-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      # same-origin from the browser's point of view: Render proxies this
      # server-side, so no CORS / cross-site cookie configuration is needed.
      - type: rewrite
        source: /api/*
        destination: https://cinelog-backend-ouzz.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
